<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#14161a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Commander Turn Timer</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- MENU -->
  <section id="screen-menu" class="screen">
    <header class="bar"><h1>Commander Turn Timer</h1></header>
    <div class="content center-col">
      <button id="btn-resume" class="btn btn-primary btn-big hidden">Resume game</button>
      <button id="btn-new-game" class="btn btn-primary btn-big">New game</button>
      <button id="btn-profiles" class="btn btn-big">Time profiles</button>
    </div>
  </section>

  <!-- GAME SETUP -->
  <section id="screen-setup" class="screen hidden">
    <header class="bar">
      <button class="btn btn-ghost" data-back="menu">‹ Back</button>
      <h1>New game</h1>
    </header>
    <div class="content">
      <label class="field">
        <span>Players</span>
        <div class="stepper">
          <button id="players-dec" class="btn">−</button>
          <output id="players-count">4</output>
          <button id="players-inc" class="btn">+</button>
        </div>
      </label>
      <div id="player-names" class="names"></div>
      <label class="field">
        <span>Time profile</span>
        <select id="setup-profile"></select>
      </label>
      <p id="setup-profile-summary" class="muted small"></p>
    </div>
    <footer class="bar bar-bottom">
      <button id="btn-start" class="btn btn-primary btn-wide">Start</button>
    </footer>
  </section>

  <!-- PROFILES LIST -->
  <section id="screen-profiles" class="screen hidden">
    <header class="bar">
      <button class="btn btn-ghost" data-back="menu">‹ Back</button>
      <h1>Time profiles</h1>
    </header>
    <div class="content">
      <ul id="profile-list" class="list"></ul>
    </div>
    <footer class="bar bar-bottom">
      <button id="btn-add-profile" class="btn btn-primary btn-wide">+ New profile</button>
    </footer>
  </section>

  <!-- PROFILE EDITOR -->
  <section id="screen-editor" class="screen hidden">
    <header class="bar">
      <button id="editor-cancel" class="btn btn-ghost">‹ Cancel</button>
      <h1>Edit profile</h1>
    </header>
    <div class="content">
      <label class="field">
        <span>Name</span>
        <input id="editor-name" type="text" maxlength="40" autocomplete="off">
      </label>
      <p class="muted small">Each row sets the countdown for every turn up to and including “Until turn”. The last row covers the rest of the game.</p>
      <div class="rows-head"><span>Until turn</span><span>Time (m:ss)</span><span></span></div>
      <div id="editor-rows"></div>
      <button id="editor-add-row" class="btn btn-small">+ Add row</button>
      <p id="editor-error" class="error hidden"></p>
    </div>
    <footer class="bar bar-bottom two">
      <button id="editor-delete" class="btn btn-danger">Delete</button>
      <button id="editor-save" class="btn btn-primary">Save</button>
    </footer>
  </section>

  <!-- GAME -->
  <section id="screen-game" class="screen game hidden">
    <header class="bar game-bar">
      <button id="btn-end" class="btn btn-ghost btn-small">End game</button>
      <div class="turn">Turn <strong id="game-turn">1</strong></div>
      <div class="profile-tag small muted" id="game-profile"></div>
    </header>
    <div class="game-main">
      <div id="game-player" class="player-name">Player 1</div>
      <button id="game-timer" class="timer" aria-label="Start or pause the timer">3:00</button>
      <div id="game-hint" class="muted small hint">Tap the timer to start</div>
    </div>
    <footer class="bar bar-bottom two game-actions">
      <button id="btn-undo" class="btn btn-big">↶ Undo</button>
      <button id="btn-next" class="btn btn-primary btn-big">Next player ›</button>
    </footer>
  </section>

  <script src="app.js"></script>
</body>
</html>
